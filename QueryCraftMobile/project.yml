    type: library.static
    platform: iOS
    sources:
      - ../QueryCraftDrivers/MariaDBTransport/Sources/QueryCraftMariaDBTransport
    dependencies:
      - target: QueryCraftMobileCore
    settings:
      base:
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../QueryCraftDrivers/MariaDBTransport/Sources/CMariaDB $(BUILT_PRODUCTS_DIR)/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../.build/ios-native/$(PLATFORM_NAME)-$(CURRENT_ARCH)/lib
        OTHER_LDFLAGS: $(inherited) -lmariadbclient -lssl -lcrypto -lz -liconv -lresolv
  CHiredis:
    type: library.static
    platform: iOS
    sources:
      - path: ../QueryCraftDrivers/Sources/CHiredis
        headerVisibility: public
    settings:
