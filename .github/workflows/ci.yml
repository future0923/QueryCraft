name: Build QueryCraft

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: querycraft-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install XcodeBuildMCP
        run: npm install --global xcodebuildmcp@2.6.2

      - name: Build the application
        run: |
          xcodebuildmcp macos build \
            --workspace-path QueryCraft.xcworkspace \
            --scheme QueryCraft \
            --configuration Debug \
            --derived-data-path "$RUNNER_TEMP/querycraft-derived-data" \
            --extra-args \
              "CODE_SIGN_IDENTITY=-" \
              "DEVELOPMENT_TEAM=" \
              "CODE_SIGN_STYLE=Manual" \
            --output json

      - name: Test free access and settings navigation
        run: |
          xcodebuildmcp macos test \
            --workspace-path QueryCraft.xcworkspace \
            --scheme QueryCraft \
            --configuration Debug \
            --derived-data-path "$RUNNER_TEMP/querycraft-derived-data" \
            --extra-args \
              "-only-testing:QueryCraftFeatureTests/LicenseAccessGateTests" \
              "-only-testing:QueryCraftFeatureTests/SettingsNavigationTests" \
              "-only-testing:QueryCraftFeatureTests/SettingsCopyTests" \
              "-only-testing:QueryCraftFeatureTests/DatabaseDriverRegistryTests" \
            --output json
