name: Package and publish QueryCraft

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload client artifacts and create the GitHub Release
        required: true
        default: false
        type: boolean
      publish_components:
        description: Publish changed MCP/Skill/SSH components independently
        type: boolean
        default: false
      source_run_id:
        description: Reuse macOS artifacts from an earlier workflow run
        required: false
        type: string
      publish_drivers:
        description: Build and publish selected external database drivers
        required: true
        default: false
        type: boolean
      rebuild_driver:
        description: Rebuild one driver while reusing artifacts from source_run_id
        required: true
        default: none
        type: choice
        options:
          - none
          - mysql
          - postgresql
          - doris
          - redis
          - elasticsearch
          - kafka
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: querycraft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
      source_run_id: ${{ steps.release.outputs.source_run_id }}
      publish_drivers: ${{ steps.release.outputs.publish_drivers }}
      build_client: ${{ steps.release.outputs.build_client }}
      rebuild_driver: ${{ steps.release.outputs.rebuild_driver }}
      driver_matrix: ${{ steps.release.outputs.driver_matrix }}
      client_build_matrix: ${{ steps.artifacts.outputs.client_build_matrix }}
      driver_build_matrix: ${{ steps.artifacts.outputs.driver_build_matrix }}
      build_update: ${{ steps.artifacts.outputs.build_update }}
      has_new_artifacts: ${{ steps.artifacts.outputs.has_new_artifacts }}
      build_ref: ${{ steps.artifacts.outputs.build_ref }}
      mcp_changed: ${{ steps.components.outputs.mcp_changed }}
      skill_changed: ${{ steps.components.outputs.skill_changed }}
      ssh_changed: ${{ steps.components.outputs.ssh_changed }}
      publish_components: ${{ steps.release.outputs.publish_components }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check component and driver release rules
        run: |
          python3 scripts/test-component-release-plan.py
          python3 scripts/test-release-artifact-plan.py
          python3 scripts/test-ssh-distribution.py
          python3 scripts/test-update-archives.py
      - id: components
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          args=(--require-notes --github-output "$GITHUB_OUTPUT" --output component-plan.json)
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            version="$(awk -F ' = ' '/^MARKETING_VERSION = / { print $2; exit }' Config/Shared.xcconfig)"
            args+=(--head "v$version")
          fi
          python3 scripts/component-release-plan.py "${args[@]}"
      - id: release
        env:
          REQUESTED_PUBLISH_COMPONENTS: ${{ github.event_name == 'push' || inputs.publish_components || false }}
          CHANGED_DRIVERS: ${{ steps.components.outputs.changed_drivers }}
          DRIVER_REQUIREMENTS: ${{ steps.components.outputs.driver_requirements }}
          REQUESTED_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          REQUESTED_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          # Tags publish only genuinely changed drivers; unchanged drivers retain
          # their published identities. Manual builds require an explicit opt-in.
          REQUESTED_PUBLISH_DRIVERS: ${{ inputs.publish_drivers || (github.event_name == 'push' && steps.components.outputs.changed_drivers != '[]') }}
          REQUESTED_REBUILD_DRIVER: ${{ inputs.rebuild_driver }}
        run: |
          set -euo pipefail
          version="$(awk -F ' = ' '/^MARKETING_VERSION = / { print $2; exit }' Config/Shared.xcconfig)"
          build="$(awk -F ' = ' '/^CURRENT_PROJECT_VERSION = / { print $2; exit }' Config/Shared.xcconfig)"
          source_run_id="${REQUESTED_SOURCE_RUN_ID:-}"
          rebuild_driver="${REQUESTED_REBUILD_DRIVER:-none}"
          driver_matrix='["mysql","postgresql","doris","redis","elasticsearch","kafka"]'
          case "$rebuild_driver" in
            none) ;;
            mysql|postgresql|doris|redis|elasticsearch|kafka)
              if [[ -z "$source_run_id" || "$REQUESTED_PUBLISH_DRIVERS" != "true" ]]; then
                echo "Rebuilding one driver requires a source run and driver publishing." >&2
                exit 1
              fi
              driver_matrix="$(jq -cn --arg driver "$rebuild_driver" '[$driver]')"
              ;;
            *) echo "Invalid driver rebuild target." >&2; exit 1 ;;
          esac
          if [[ "$REQUESTED_PUBLISH_DRIVERS" == "true" ]]; then
            if [[ "$rebuild_driver" == "none" ]]; then
              driver_matrix="$CHANGED_DRIVERS"
              if [[ "$driver_matrix" == "[]" ]]; then
                echo "No relevant driver changes; refusing to publish unchanged drivers." >&2; exit 1
              fi
            elif ! jq -e --arg driver "$rebuild_driver" 'index($driver) != null' <<<"$CHANGED_DRIVERS" >/dev/null; then
              echo "Selected driver has no relevant changes; refusing publication." >&2; exit 1
            elif ! jq -e --arg driver "$rebuild_driver" '.[$driver] | length == 1' <<<"$DRIVER_REQUIREMENTS" >/dev/null; then
              echo "Shared transport/API changes require related drivers together. Use rebuild_driver=none." >&2; exit 1
            fi
          fi
          build_client=true
          test -n "$version"
          test -n "$build"
          test -f "docs/releases/$version.md"

          if [[ -n "$source_run_id" && ! "$source_run_id" =~ ^[0-9]+$ ]]; then
            echo "Source run ID must be numeric." >&2
            exit 1
          fi
          if [[ -n "$source_run_id" && "$REQUESTED_PUBLISH" != "true" && "$REQUESTED_PUBLISH_DRIVERS" != "true" && "$REQUESTED_PUBLISH_COMPONENTS" != "true" ]]; then
            echo "Reusing a source run requires application, driver or component publishing." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "$version" ]]
          elif [[ "$REQUESTED_PUBLISH" == "true" ]]; then
            test -n "$source_run_id"
            git ls-remote --exit-code origin "refs/tags/v$version" >/dev/null
          elif [[ "$REQUESTED_PUBLISH_DRIVERS" == "true" ]]; then
            git ls-remote --exit-code origin "refs/tags/v$version" >/dev/null
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish_components=$REQUESTED_PUBLISH_COMPONENTS" >> "$GITHUB_OUTPUT"
          echo "publish=$REQUESTED_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "publish_drivers=$REQUESTED_PUBLISH_DRIVERS" >> "$GITHUB_OUTPUT"
          echo "build_client=$build_client" >> "$GITHUB_OUTPUT"
          echo "rebuild_driver=$rebuild_driver" >> "$GITHUB_OUTPUT"
          echo "driver_matrix=$driver_matrix" >> "$GITHUB_OUTPUT"

      - id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BUILD: ${{ steps.release.outputs.build }}
          SELECTED_DRIVERS: ${{ steps.release.outputs.driver_matrix }}
          PUBLISH_DRIVERS: ${{ steps.release.outputs.publish_drivers }}
          SOURCE_RUN_ID: ${{ steps.release.outputs.source_run_id }}
          REBUILD_DRIVER: ${{ steps.release.outputs.rebuild_driver }}
        run: |
          python3 scripts/ci/release-artifact-plan.py --version "$VERSION" --build "$BUILD" \
            --drivers "$SELECTED_DRIVERS" --publish-drivers "$PUBLISH_DRIVERS" \
            --source-run "$SOURCE_RUN_ID" --rebuild-driver "$REBUILD_DRIVER" \
            --github-output "$GITHUB_OUTPUT"

  build_client:
    needs: metadata
    if: needs.metadata.outputs.client_build_matrix != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.client_build_matrix) }}
    env:
      QUERYCRAFT_UPDATE_BASE_URL: https://querycraft.debug-tools.cc
      QUERYCRAFT_DRIVER_DOWNLOAD_BASE_URL: https://querycraft.debug-tools.cc/drivers
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      QUERYCRAFT_BUILD_MCP: ${{ needs.metadata.outputs.mcp_changed }}
      QUERYCRAFT_BUILD_SKILL: ${{ needs.metadata.outputs.skill_changed }}
      QUERYCRAFT_BUILD_SSH: ${{ needs.metadata.outputs.ssh_changed }}
      QUERYCRAFT_BUILD_CLIENT: true
      QUERYCRAFT_BUILD_DRIVERS: false
      QUERYCRAFT_BUILD_UNIVERSAL_UPDATE: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.build_ref }}

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Import persistent application signing identity
        env:
          QUERYCRAFT_SIGNING_P12_BASE64: ${{ secrets.QUERYCRAFT_SIGNING_P12_BASE64 }}
          QUERYCRAFT_SIGNING_P12_PASSWORD: ${{ secrets.QUERYCRAFT_SIGNING_P12_PASSWORD }}
        run: |
          export QUERYCRAFT_SIGNING_DIRECTORY="$RUNNER_TEMP/querycraft-signing"
          echo "QUERYCRAFT_SIGNING_DIRECTORY=$QUERYCRAFT_SIGNING_DIRECTORY" >> "$GITHUB_ENV"
          python3 scripts/code-signing.py import-ci

      - name: Install XcodeBuildMCP
        run: npm install --global xcodebuildmcp@2.6.2

      - name: Build and package client artifacts
        env:
          QUERYCRAFT_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          QUERYCRAFT_RELEASE_BUILD: ${{ needs.metadata.outputs.build }}
          DERIVED_DATA_ROOT: ${{ runner.temp }}/querycraft-derived-data
        run: scripts/ci/build-release-artifacts.sh "${{ matrix.architecture }}" "artifacts/${{ matrix.architecture }}"

      - name: Remove temporary signing keychain
        if: always()
        run: python3 scripts/code-signing.py cleanup-ci

      - id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: querycraft-release-client-${{ matrix.architecture }}-v2
          path: artifacts/${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 14

      - name: Retry artifact upload
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: querycraft-release-client-${{ matrix.architecture }}-v2
          path: artifacts/${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  build_update:
    needs: [metadata, build_client]
    if: >-
      ${{ always() && needs.metadata.result == 'success' &&
          needs.metadata.outputs.build_update == 'true' &&
          contains(fromJSON('["success","skipped"]'), needs.build_client.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.build_ref }}
      - name: Download cached architecture artifacts
        if: needs.metadata.outputs.source_run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: querycraft-release-client-*-v2
          path: artifacts/update
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.metadata.outputs.source_run_id }}
      - name: Download newly built architecture artifacts
        if: needs.build_client.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: querycraft-release-client-*-v2
          path: artifacts/update
          merge-multiple: true
      - name: Assemble architecture-aware update feed
        run: |
          python3 scripts/update-archives.py assemble --directory artifacts/update \
            --version "${{ needs.metadata.outputs.version }}" \
            --notes "docs/releases/${{ needs.metadata.outputs.version }}.md" --previous appcast.xml
      - id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: querycraft-release-client-update-v2
          path: |
            artifacts/update/appcast.xml
            artifacts/update/release-notes.md
          if-no-files-found: error
          retention-days: 14
      - name: Retry artifact upload
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: querycraft-release-client-update-v2
          path: |
            artifacts/update/appcast.xml
            artifacts/update/release-notes.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  build_drivers:
    needs: metadata
    if: needs.metadata.outputs.driver_build_matrix != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.driver_build_matrix) }}
    env:
      QUERYCRAFT_UPDATE_BASE_URL: https://querycraft.debug-tools.cc
      QUERYCRAFT_DRIVER_DOWNLOAD_BASE_URL: https://querycraft.debug-tools.cc/drivers
      QUERYCRAFT_BUILD_CLIENT: false
      QUERYCRAFT_BUILD_DRIVERS: true
      QUERYCRAFT_BUILD_UNIVERSAL_UPDATE: false
      QUERYCRAFT_DRIVER_TARGET: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.build_ref }}

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install XcodeBuildMCP
        run: npm install --global xcodebuildmcp@2.6.2

      - name: Install Kafka native dependencies
        if: matrix.database == 'kafka'
        run: |
          brew install librdkafka pkgconf
          echo "LIBRDKAFKA_PREFIX=$(brew --prefix librdkafka)" >> "$GITHUB_ENV"
          echo "LIBZSTD_PREFIX=$(brew --prefix zstd)" >> "$GITHUB_ENV"
          pkg-config --exists rdkafka

      - name: Build and package ${{ matrix.database }} driver
        env:
          QUERYCRAFT_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          QUERYCRAFT_RELEASE_BUILD: ${{ needs.metadata.outputs.build }}
          DERIVED_DATA_ROOT: ${{ runner.temp }}/querycraft-derived-data
        run: scripts/ci/build-release-artifacts.sh "${{ matrix.architecture }}" "artifacts/${{ matrix.database }}-${{ matrix.architecture }}"

      - id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: querycraft-release-driver-${{ matrix.database }}-${{ matrix.architecture }}
          path: artifacts/${{ matrix.database }}-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 14

      - name: Retry artifact upload
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: querycraft-release-driver-${{ matrix.database }}-${{ matrix.architecture }}
          path: artifacts/${{ matrix.database }}-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  verify_runtime:
    needs: [metadata, build_client, build_drivers]
    if: >-
      ${{ always() && needs.metadata.result == 'success' &&
          (needs.metadata.outputs.mcp_changed == 'true' || needs.metadata.outputs.ssh_changed == 'true') &&
          contains(fromJSON('["success","skipped"]'), needs.build_client.result) &&
          contains(fromJSON('["success","skipped"]'), needs.build_drivers.result) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.build_ref }}
      - uses: actions/download-artifact@v8
        if: needs.metadata.outputs.source_run_id != ''
        with:
          pattern: querycraft-release-*
          path: runtime-artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.metadata.outputs.source_run_id }}
      - uses: actions/download-artifact@v8
        if: needs.metadata.outputs.has_new_artifacts == 'true'
        with:
          pattern: querycraft-release-*
          path: runtime-artifacts
          merge-multiple: true
      - name: Verify standalone MCP and all six driver families
        if: needs.metadata.outputs.mcp_changed == 'true'
        run: python3 scripts/ci/verify-release-runtime.py runtime-artifacts
      - name: Verify native SSH package, ABI and optional capabilities
        if: needs.metadata.outputs.ssh_changed == 'true'
        run: python3 scripts/test-ssh-package.py --directory runtime-artifacts

  publish:
    needs:
      - metadata
      - build_client
      - build_update
      - build_drivers
      - verify_runtime
    if: >-
      ${{ always() && needs.metadata.result == 'success' &&
          (needs.metadata.outputs.publish == 'true' ||
           needs.metadata.outputs.publish_drivers == 'true' ||
           needs.metadata.outputs.publish_components == 'true') &&
          contains(fromJSON('["success","skipped"]'), needs.build_client.result) &&
          contains(fromJSON('["success","skipped"]'), needs.build_update.result) &&
          contains(fromJSON('["success","skipped"]'), needs.build_drivers.result) &&
          ((needs.metadata.outputs.mcp_changed != 'true' && needs.metadata.outputs.ssh_changed != 'true') || needs.verify_runtime.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: write
    env:
      QUERYCRAFT_RESOURCE_DEPLOY_URL: ${{ vars.QUERYCRAFT_RESOURCE_DEPLOY_URL || 'https://querycraft.debug-tools.cc/admin/resources/deploy' }}
      QUERYCRAFT_RESOURCE_DEPLOY_TOKEN: ${{ secrets.QUERYCRAFT_RESOURCE_DEPLOY_TOKEN }}
      QUERYCRAFT_UPDATE_BASE_URL: https://querycraft.debug-tools.cc
      QUERYCRAFT_DEPLOY_CLIENT: ${{ needs.metadata.outputs.publish }}
      QUERYCRAFT_DEPLOY_DRIVERS: ${{ needs.metadata.outputs.publish_drivers }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.build_ref }}

      - name: Install publish dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils

      - uses: actions/download-artifact@v8
        if: needs.metadata.outputs.source_run_id == ''
        with:
          pattern: querycraft-release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: needs.metadata.outputs.source_run_id != ''
        with:
          pattern: querycraft-release-*
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.metadata.outputs.source_run_id }}

      - name: Download newly completed artifacts
        uses: actions/download-artifact@v8
        if: needs.metadata.outputs.source_run_id != '' && needs.metadata.outputs.has_new_artifacts == 'true'
        with:
          pattern: querycraft-release-*
          path: dist
          merge-multiple: true

      - name: Publish selected resources
        if: needs.metadata.outputs.publish == 'true' || needs.metadata.outputs.publish_drivers == 'true'
        env:
          SELECTED_DRIVERS: ${{ needs.metadata.outputs.driver_matrix }}
        run: |
          set -euo pipefail
          if [[ "$QUERYCRAFT_DEPLOY_DRIVERS" == "true" ]]; then
            export QUERYCRAFT_DEPLOY_DRIVER_TYPES="$(jq -r 'join(",")' <<<"$SELECTED_DRIVERS")"
          fi
          scripts/deploy-release-artifacts.sh "${{ needs.metadata.outputs.version }}" dist

      - name: Publish changed independent components
        if: needs.metadata.outputs.publish_components == 'true'
        env:
          MCP_CHANGED: ${{ needs.metadata.outputs.mcp_changed }}
          SKILL_CHANGED: ${{ needs.metadata.outputs.skill_changed }}
          SSH_CHANGED: ${{ needs.metadata.outputs.ssh_changed }}
        run: python3 scripts/deploy-components.py --directory dist --github
      - name: Synchronize canonical published download URLs
        if: needs.metadata.outputs.publish == 'true' || needs.metadata.outputs.publish_drivers == 'true'
        env:
          SELECTED_DRIVERS: ${{ needs.metadata.outputs.driver_matrix }}
        run: |
          export QUERYCRAFT_DEPLOY_DRIVER_TYPES="$(jq -r 'join(",")' <<<"$SELECTED_DRIVERS")"
          python3 scripts/ci/sync-published-release-metadata.py dist

      - name: Create or update GitHub client release
        if: needs.metadata.outputs.publish == 'true'
        env:
          RELEASE_TAG: v${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "QueryCraft ${{ needs.metadata.outputs.version }}" \
              --notes-file "docs/releases/${{ needs.metadata.outputs.version }}.md"
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            dist/QueryCraft-*.dmg \
            dist/QueryCraft-*.tar.xz \
            dist/appcast.xml \
            dist/release-notes.md

      - name: Update GitHub driver assets
        if: needs.metadata.outputs.publish_drivers == 'true'
        env:
          RELEASE_TAG: v${{ needs.metadata.outputs.version }}
          SELECTED_DRIVERS: ${{ needs.metadata.outputs.driver_matrix }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          while IFS= read -r driver; do
            gh release upload "$RELEASE_TAG" --clobber \
              "dist/${driver}-x86_64.json" \
              "dist/${driver}-arm64.json" \
              "dist/${driver}-driver-"*.zip
          done < <(jq -r '.[]' <<<"$SELECTED_DRIVERS")
